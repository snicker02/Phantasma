<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phantasma — optical illusion lab</title>
<meta name="description" content="Parametric optical illusions rendered live in WebGL: geometric, motion, lightness and colour.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d6a84a%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%224%22 fill=%22%23111%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=1.5.0">
  <!-- GoatCounter analytics (privacy-friendly, no cookies) -->
  <script data-goatcounter="https://snicker02.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header id="top">
  <div class="brand"><b>Phantasma</b><span class="sub">optical illusion lab</span><span class="ver" id="ver"></span></div>
  <div class="bar">
    <button id="prev" type="button" title="Previous (←)">‹</button>
    <select id="pick" aria-label="Illusion"></select>
    <button id="next" type="button" title="Next (→)">›</button>
    <button id="revealBtn" type="button" title="Reveal the truth (R)">Reveal</button>
    <button id="playBtn" type="button" title="Play / pause (Space)">Pause</button>
    <button id="fsBtn" type="button" title="Fullscreen (F)">⛶</button>
    <button id="shelfBtn" type="button" title="Shared image shelf: send this view to another snicker02 app, or load a photo">⇄ Shelf</button>
  </div>
</header>

<main id="app">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="stare" hidden></div>
    <div id="hint"></div>
    <div id="err" hidden></div>
  </div>

  <aside id="panel">
    <nav class="tabstrip" id="tabstrip" role="tablist"></nav>
    <div id="secs">
      <section class="sec" id="sec-illusion">
        <h2>Illusion</h2>
        <div id="list"></div>
        <div class="info">
          <p><b>Look for:</b> <span id="infoSee"></span></p>
          <p><b>Why:</b> <span id="infoWhy"></span></p>
        </div>
      </section>

      <section class="sec" id="sec-controls">
        <h2>Controls</h2>
        <div class="row actions" id="stareRow" hidden>
          <button id="stareBtn" type="button" class="accent">Start stare</button>
        </div>
        <div class="row actions" id="photoRow" hidden>
          <label class="filebtn">Load photo<input id="photoIn" type="file" accept="image/*"></label>
        </div>
        <label class="chk" id="revealRow"><input id="revealChk" type="checkbox"> <span id="revealLbl">Reveal</span></label>
        <div id="params"></div>
        <div class="row actions">
          <button id="randBtn" type="button">Randomize</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </section>

      <section class="sec" id="sec-colors">
        <h2>Colours</h2>
        <div id="colors"></div>
        <div class="row actions">
          <button id="invertBtn" type="button">Invert</button>
          <button id="colReset" type="button">Reset colours</button>
        </div>
      </section>

      <section class="sec" id="sec-view">
        <h2>View</h2>
        <div class="ctl"><label>Zoom <output id="zoomOut"></output></label><input id="zoom" type="range" min="-2.3" max="3.6" step="0.01" value="0"></div>
        <div class="ctl"><label>Rotation <output id="rotOut"></output></label><input id="rotIn" type="range" min="-180" max="180" step="1" value="0"></div>
        <div class="ctl" id="orbitCtl" hidden><label>Orbit <output id="orbitOut"></output></label><input id="orbitIn" type="range" min="-180" max="180" step="1" value="0"></div>
        <div class="ctl" id="tiltCtl" hidden><label>Tilt <output id="tiltOut"></output></label><input id="tiltIn" type="range" min="-80" max="80" step="1" value="0"></div>
        <div class="ctl" id="speedCtl"><label>Animation speed <output id="speedOut"></output></label><input id="speed" type="range" min="0" max="3" step="0.05" value="1"></div>
        <div class="ctl"><label>Quality</label>
          <select id="quality"><option value="1">Fast (1×)</option><option value="2" selected>Smooth (4×)</option><option value="3">Best (9×)</option></select>
        </div>
        <div class="row actions"><button id="viewReset" type="button">Reset view</button></div>
        <div class="row actions resetall"><button id="resetAll" type="button" class="danger">Reset everything</button></div>
        <p class="note">Restores every illusion's settings and colours, the view, quality, speed and export options to their defaults, and clears the loaded photo.</p>
      </section>

      <section class="sec" id="sec-export">
        <h2>Export</h2>
        <div class="ctl"><label>PNG size</label>
          <select id="pngSize">
            <option value="1">Screen</option><option value="2" selected>Screen × 2</option>
            <option value="1920x1080">1920 × 1080</option><option value="3840x2160">3840 × 2160</option>
            <option value="2048x2048">2048 × 2048</option><option value="4096x4096">4096 × 4096</option>
          </select>
        </div>
        <div class="row actions"><button id="pngBtn" type="button">Save PNG</button></div>
        <div id="videoCtl">
          <div class="ctl"><label>Video format</label>
            <select id="vidFmt"><option value="mp4" selected>MP4 (H.264)</option><option value="webm">WebM</option></select>
          </div>
          <div class="ctl" id="vidSizeCtl"><label>Video size</label>
            <select id="vidSize">
              <option value="screen">Screen</option><option value="1280x720">1280 × 720</option>
              <option value="1920x1080" selected>1920 × 1080</option><option value="1080x1080">1080 × 1080 square</option>
              <option value="1080x1920">1080 × 1920 vertical</option><option value="3840x2160">3840 × 2160</option>
            </select>
          </div>
          <div class="ctl" id="vidFpsCtl"><label>Frame rate</label>
            <select id="vidFps"><option value="30">30 fps</option><option value="60" selected>60 fps</option></select>
          </div>
          <div class="ctl"><label>Video length <output id="recOut"></output></label><input id="recLen" type="range" min="2" max="30" step="1" value="6"></div>
          <div class="row actions"><button id="recBtn" type="button" class="accent">Export MP4</button></div>
        </div>
        <div class="row actions"><button id="linkBtn" type="button">Copy link to this setup</button></div>
        <p class="note" id="exportNote"></p>
      </section>
      <footer class="credit">Created with help from Claude AI</footer>
    </div>
  </aside>
</main>
<script src="https://snicker02.github.io/shared/bridge.js"></script>
<script type="module" src="main.js?v=1.5.0"></script>
</body>
</html>
